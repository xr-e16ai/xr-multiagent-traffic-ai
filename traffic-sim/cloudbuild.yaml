steps:
  # 1. Install dependencies
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Build the Vite frontend, injecting GEMINI_API_KEY from Secret Manager
  - name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm run build'
    secretEnv:
      - 'GEMINI_API_KEY'

  # 3. Build the Docker image using the existing Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t',
      'asia-south1-docker.pkg.dev/$PROJECT_ID/traffic-sim/traffic-sim:$COMMIT_SHA',
      '.'
    ]

  # 4. Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south1-docker.pkg.dev/$PROJECT_ID/traffic-sim/traffic-sim:$COMMIT_SHA'
    ]

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/traffic-sim/traffic-sim:$COMMIT_SHA'

# Retrieve secret securely from Google Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY

# Use the specific service account attached to this deployment
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/traffic-sim-backend@multi-agent-traffic-sim-2026.iam.gserviceaccount.com'
